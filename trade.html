<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Trade</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
color:gold;
text-align:center;
}

form{
max-width:500px;
margin:auto;
}

label{
display:block;
margin-top:15px;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:none;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:gold;
color:black;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:orange;
}
</style>

</head>

<body>

<h1>📈 New Trade Entry</h1>

<form>

<label>Date</label>
<input type="date" id="date">

<label>Pair</label>
<input type="text" id="pair" placeholder="XAUUSD">

<label>Direction</label>
<select id="direction">
<option>BUY</option>
<option>SELL</option>
</select>

<label>Entry Price</label>
<input type="number" id="entry">

<label>Stop Loss</label>
<input type="number" id="sl">

<label>Take Profit</label>
<input type="number" id="tp">

<label>Lot Size</label>
<input type="number" step="0.01" id="lot">

<label>Notes</label>
<textarea id="notes" rows="5"></textarea>

<button type="button" onclick="saveTrade()">
Save Trade
</button>

</form>

<script>

function saveTrade(){

const trade={
date:document.getElementById("date").value,
pair:document.getElementById("pair").value,
direction:document.getElementById("direction").value,
entry:document.getElementById("entry").value,
sl:document.getElementById("sl").value,
tp:document.getElementById("tp").value,
lot:document.getElementById("lot").value,
notes:document.getElementById("notes").value
};

let trades=JSON.parse(localStorage.getItem("trades"))||[];

trades.push(trade);

localStorage.setItem("trades",JSON.stringify(trades));

alert("Trade Saved Successfully!");

window.location.href="index.html";

}

</script>
<script src="script.js"></script>
</body>
</html>
