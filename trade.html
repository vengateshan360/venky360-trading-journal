<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Trade</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
h1{
    color:gold;
    text-align:center;
}
form{
    max-width:500px;
    margin:auto;
}
label{
    display:block;
    margin-top:15px;
}
input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:none;
}
button{
    width:100%;
    padding:15px;
    margin-top:20px;
    background:gold;
    color:black;
    border:none;
    border-radius:10px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>📈 New Trade Entry</h1>

<form>

<label>Date</label>
<input type="date">

<label>Pair</label>
<input type="text" placeholder="XAUUSD">

<label>Direction</label>
<select>
<option>BUY</option>
<option>SELL</option>
</select>

<label>Entry Price</label>
<input type="number">

<label>Stop Loss</label>
<input type="number">

<label>Take Profit</label>
<input type="number">

<label>Lot Size</label>
<input type="number" step="0.01">

<label>Notes</label>
<textarea rows="4"></textarea>

<button type="button" onclick="alert('Trade Saved Successfully!')">
Save Trade
</button>

</form>

</body>
</html>
