<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VENKY-360-TRADER</title>

  <style>
    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      width:320px;
      background:#222;
      padding:20px;
      border-radius:10px;
    }

    h2{
      text-align:center;
      color:gold;
    }

    input{
      width:100%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:12px;
      background:gold;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:orange;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>VENKY-360-TRADER</h2>

  <input type="email" id="email" placeholder="Email">

  <input type="password" id="password" placeholder="Password">

  <button id="loginBtn">Login</button>

  <br><br>

  <button id="signupBtn">Create Account</button>
</div>

<script src="script.js"></script>

</body>
</html>
